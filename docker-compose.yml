version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mone_postgres
    restart: always
    environment:
      POSTGRES_USER: mone
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: mone_pgbouncer
    restart: always
    depends_on:
      - postgres
    ports:
      - "6432:5432"
    environment:
      DB_USER: mone
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_NAME: mone
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: md5
      AUTH_FILE: /etc/pgbouncer/userlist.txt

  redis:
    image: redis
    container_name: mone_pubsub
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend API server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: mone_server
    restart: always
    depends_on:
      - pgbouncer
      - redis
    env_file:
      - apps/server/.env
    environment:
      DATABASE_URL: postgresql://mone:postgres@postgres:5432/mone
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

  # Next.js frontend
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: mone_client
    restart: always
    env_file:
      - apps/client/.env.local
    environment:
      NEXT_SERVER_API_URL: http://server:3001
    ports:
      - "3000:3000"

  # Go matching engine microservice
  engine:
    build:
      context: ./apps/server/engine
    container_name: mone_engine
    restart: always
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092

  # Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mone_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Nginx reverse proxy + load balancer
  nginx:
    image: nginx:alpine
    container_name: mone_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  redis_data:
