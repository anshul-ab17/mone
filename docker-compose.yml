version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mone_postgres
    restart: always
    environment:
      POSTGRES_USER: mone
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: mone_pgbouncer
    restart: always
    depends_on:
      - postgres
    ports:
      - "6432:5432"
    environment:
      DB_USER: mone
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_NAME: mone
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: md5
      AUTH_FILE: /etc/pgbouncer/userlist.txt

  redis:
    image: redis
    container_name: mone_pubsub
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # NATS (JetStream enabled) — replaces Kafka
  nats:
    image: nats:2.10-alpine
    container_name: mone_nats
    restart: always
    command: ["--jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  # Backend API server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: mone_server
    restart: always
    depends_on:
      - pgbouncer
      - redis
      - nats
    env_file:
      - apps/server/.env
    environment:
      DATABASE_URL: postgresql://mone:postgres@postgres:5432/mone
      REDIS_URL: redis://redis:6379
      NATS_HOST: nats
      NATS_PORT: 4222
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

  # Next.js frontend
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: mone_client
    restart: always
    env_file:
      - apps/client/.env.local
    environment:
      NEXT_SERVER_API_URL: http://server:3001
    ports:
      - "3000:3000"

  # Go matching engine microservice
  engine:
    build:
      context: ./apps/server/engine
    container_name: mone_engine
    restart: always
    depends_on:
      - nats
    environment:
      NATS_HOST: nats
      NATS_PORT: 4222

  # Nginx reverse proxy + load balancer
  nginx:
    image: nginx:alpine
    container_name: mone_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  redis_data:
  nats_data:
