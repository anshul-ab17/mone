namespace: mone

image:
  server: mone/server
  client: mone/client
  engine: mone/engine
  tag: latest
  pullPolicy: IfNotPresent

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80

client:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

engine:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  storage: 10Gi

redis:
  storage: 2Gi

ingress:
  host: ""                      # set to yourdomain.com
  tls: false                    # set true once cert-manager is configured
  clusterIssuer: letsencrypt-prod

monitoring:
  prometheus:
    storage: 5Gi
    retention: 15d
  grafana:
    storage: 2Gi
    adminPassword: admin        # override in values.prod.yaml

# All secrets — override in values.prod.yaml or via --set
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  jwtRefreshSecret: ""
  solanaMasterSecret: ""
  solanaRpcUrl: "https://api.devnet.solana.com"
  usdcMint: ""
  kafkaBroker: "redpanda:9092"
  useKafka: "false"
  frontendUrl: ""
  nextPublicApiUrl: ""
  nextPublicSolanaRpcUrl: "https://api.devnet.solana.com"
