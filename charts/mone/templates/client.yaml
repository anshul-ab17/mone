apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      {{- include "mone.selectorLabels" "client" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mone.selectorLabels" "client" | nindent 8 }}
    spec:
      containers:
        - name: client
          image: {{ .Values.image.client }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: mone-secrets
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: mone-secrets
                  key: NEXT_PUBLIC_SOLANA_RPC_URL
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: {{ .Values.namespace }}
spec:
  selector:
    {{- include "mone.selectorLabels" "client" | nindent 4 }}
  ports:
    - port: 3000
