apiVersion: v1
kind: Secret
metadata:
  name: mone-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mone.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  SOLANA_MASTER_SECRET: {{ .Values.secrets.solanaMasterSecret | quote }}
  SOLANA_RPC_URL: {{ .Values.secrets.solanaRpcUrl | quote }}
  USDC_MINT: {{ .Values.secrets.usdcMint | quote }}
  KAFKA_BROKER: {{ .Values.secrets.kafkaBroker | quote }}
  USE_KAFKA: {{ .Values.secrets.useKafka | quote }}
  FRONTEND_URL: {{ .Values.secrets.frontendUrl | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.secrets.nextPublicApiUrl | quote }}
  NEXT_PUBLIC_SOLANA_RPC_URL: {{ .Values.secrets.nextPublicSolanaRpcUrl | quote }}
  GRAFANA_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | quote }}
