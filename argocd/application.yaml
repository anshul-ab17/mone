apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deletes k8s resources when app is deleted
spec:
  project: mone

  source:
    repoURL: https://github.com/anshul-ab17/mone  
    targetRevision: main
    path: charts/mone
    helm:
      valueFiles:
        - values.yaml
        - values.prod.yaml
      # Secrets passed via ArgoCD vault plugin or --set at deploy time
      # parameters:
      #   - name: secrets.jwtSecret
      #     value: $JWT_SECRET

  destination:
    server: https://kubernetes.default.svc
    namespace: mone

  syncPolicy:
    automated:
      prune: true       # delete k8s resources removed from the chart
      selfHeal: true    # revert manual changes to the cluster
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
