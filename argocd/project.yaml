# ArgoCD AppProject — scopes what the mone application is allowed to deploy
# Apply after installing ArgoCD:
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mone
  namespace: argocd
spec:
  description: Mone CEX project
  sourceRepos:
    - "*"   # restrict to your repo URL in prod, e.g. https://github.com/anshul-ab17/mone
  destinations:
    - namespace: mone
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: cert-manager.io
      kind: ClusterIssuer
