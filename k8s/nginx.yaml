# Prerequisites — run once per cluster:
#
# 1. ingress-nginx controller:
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.0/deploy/static/provider/cloud/deploy.yaml
#
# 2. cert-manager (for TLS):
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#    Then apply k8s/cert-manager.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mone-ingress
  namespace: mone
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # cert-manager.io/cluster-issuer: letsencrypt-prod   # uncomment after cert-manager setup
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: [yourdomain.com]
  #     secretName: mone-tls
  rules:
    - # host: yourdomain.com   # uncomment and set your domain
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3001
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3001
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
