apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: mone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: mone/client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: mone-secrets
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: mone-secrets
                  key: NEXT_PUBLIC_SOLANA_RPC_URL
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: mone
spec:
  selector:
    app: client
  ports:
    - port: 3000
