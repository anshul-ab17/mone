# ClusterIssuers for Let's Encrypt TLS via cert-manager.
# Apply after: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml


apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging   # use this first to test without hitting rate limits
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: anshul-ab17x@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: anshul-ab17x@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
